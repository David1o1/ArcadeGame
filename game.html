<html>
    <head>
        <title>Arcade Game</title>
    </head>
    <body>

    <canvas id="gameCanvas" width="800" height="600"> </canvas>

    <script>
        // variables and constants
        var canvas;
        var canvasContext;
        var ballX = 50;
        var ballY = 50;
        var ballSpeedX = 10;
        var ballSpeedY = 4;

        var paddle1Y = 250;
        var paddle2Y = 250;
        const PADDLE_HEIGHT = 100;
        const PADDLE_THICKNESS = 10;

        //where the mouse is in the canvas...
        function calculateMousePos(evt){
            var rect = canvas.getBoundingClientRect();
            var root = document.documentElement;
            //makes sure we get the exact coordinate regardless if we are scroll or changed the size of the window
            var mouseX = evt.clientX - rect.left - root.scrollLeft; 
            var mouseY = evt.clientY - rect.top - root.scrollTop;

            // return values as an object, javascript type beat
            return{
                x: mouseX,
                y: mouseY
            };
        }

        //function dont start until the page is loaded
        window.onload = function(){
            canvas = document.getElementById('gameCanvas');
            canvasContext = canvas.getContext('2d');
            
            var framesPerSecond = 30; 
            
            setInterval(function(){
                moveEverything();
                drawEverything();
            }, 1000/framesPerSecond);

            canvas.addEventListener('mousemove', function(evt){
                var mousePos = calculateMousePos(evt);
                paddle1Y = mousePos.y - (PADDLE_HEIGHT/2);
            });

        }

        // function to reset the ball to the center if ball hits the side walls
        function ballReset(){
            ballSpeedX = -ballSpeedX;
            ballX = canvas.width/2;
            ballY = canvas.height/2;
        }

        // function for every movement on the board
        function moveEverything(){
            ballX = ballX + ballSpeedX;
            ballY = ballY + ballSpeedY;

            //bouncing the ball if it hits the AI paddle (right side)
            if(ballX > canvas.width){
                if(ballY > paddle2Y && ballY < (paddle2Y+PADDLE_HEIGHT)){
                    ballSpeedX = -ballSpeedX;
                }
                else{
                    ballReset();
                }
            }

            ////bouncing the ball if it hits the player paddle (left side)
            if(ballX < 0){
                if(ballY > paddle1Y && ballY < (paddle1Y+PADDLE_HEIGHT)){
                    ballSpeedX = -ballSpeedX;
                }
                else{
                    ballReset();
                }
                
            }

            //Up
            if(ballY > canvas.height){
                ballSpeedY = -ballSpeedY;
            }
            //Down
            if(ballY < 0){
                ballSpeedY = -ballSpeedY;
            }
        }

        // function for every drawing on the board
        function drawEverything(){
            // colors the screen black
            colorRec(0, 0, canvas.width, canvas.height, 'black');

            // left player paddle
            colorRec(0, paddle1Y, PADDLE_THICKNESS, PADDLE_HEIGHT, 'white');

            // right computer paddle
            colorRec(canvas.width - PADDLE_THICKNESS, paddle2Y, PADDLE_THICKNESS, PADDLE_HEIGHT, 'white');

            // draws ball
            colorCircle(ballX, ballY, 10, 'white');

        }

        // function for circle
        function colorCircle(centerX, centerY, radius, drawColor){
            canvasContext.fillStyle = drawColor;
            canvasContext.beginPath();
            canvasContext.arc(centerX, centerY, radius, 0, Math.PI*2, true);
            canvasContext.fill();
        }

        // function for rectangle
        function colorRec(leftX, topY, width, height, drawColor){
            canvasContext.fillStyle = drawColor;
            canvasContext.fillRect(leftX, topY, width, height);
        }
    </script>

    </body>
</html>
